---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: driftwatchconfigs.drift.nirmata.io
spec:
  group: drift.nirmata.io
  names:
    categories:
    - drift
    kind: DriftWatchConfig
    listKind: DriftWatchConfigList
    plural: driftwatchconfigs
    singular: driftwatchconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastScanTime
      name: LastScan
      type: date
    - jsonPath: .status.driftedResources
      name: Drifted
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DriftWatchConfig configures drift scanning for a single OpenTofu workspace.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: DriftWatchConfigSpec defines the scan schedule and OpenTofu workspace configuration.
            properties:
              schedule:
                description: Schedule is a standard 5-field cron expression. Example - "0 * * * *" (hourly).
                type: string
              tofu:
                description: Tofu configures the IaC workspace and Git repository.
                properties:
                  envSecretRef:
                    description: EnvSecretRef optionally references a Secret whose keys are injected
                      as raw environment variables into the OpenTofu subprocess (e.g. AWS_ACCESS_KEY_ID).
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  repoRef:
                    description: RepoRef references the Git repository containing the OpenTofu workspace.
                    properties:
                      branch:
                        type: string
                      credentials:
                        description: Credentials references the Secret containing the Git token.
                          Optional for public repositories.
                        properties:
                          tokenSecretRef:
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - tokenSecretRef
                        type: object
                      url:
                        type: string
                    required:
                    - branch
                    - url
                    type: object
                  varsRef:
                    description: VarsRef optionally references a Secret whose keys become
                      TF_VAR_<key>=<value> inside the OpenTofu subprocess.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  workspaceCacheDir:
                    description: WorkspaceCacheDir is the local filesystem path where the IaC repo
                      is cloned. Defaults to /var/cache/drift-agent/<config-name> when omitted.
                    type: string
                required:
                - repoRef
                type: object
            required:
            - schedule
            - tofu
            type: object
          status:
            description: DriftWatchConfigStatus records the observed state.
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              driftedResources:
                type: integer
              lastScanTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
