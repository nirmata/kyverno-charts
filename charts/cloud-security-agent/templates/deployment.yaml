apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-security-agent.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cloud-security-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloud-security-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloud-security-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloud-security-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ include "cloud-security-agent.imageTag" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --health-probe-bind-address=:8081
        - --max-concurrent-scans={{ .Values.maxConcurrentScans }}
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: TF_PLUGIN_CACHE_DIR
          value: {{ .Values.workspace.mountPath }}/.plugin-cache
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: workspace-cache
          mountPath: {{ .Values.workspace.mountPath }}
      volumes:
      - name: workspace-cache
        {{- if .Values.workspace.pvcName }}
        persistentVolumeClaim:
          claimName: {{ .Values.workspace.pvcName }}
        {{- else if .Values.workspace.createPVC }}
        persistentVolumeClaim:
          claimName: {{ include "cloud-security-agent.fullname" . }}-workspace
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
