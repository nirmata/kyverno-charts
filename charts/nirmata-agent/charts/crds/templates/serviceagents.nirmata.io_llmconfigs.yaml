---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: llmconfigs.serviceagents.nirmata.io
spec:
  group: serviceagents.nirmata.io
  names:
    kind: LLMConfig
    listKind: LLMConfigList
    plural: llmconfigs
    singular: llmconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMConfig is the Schema for the llmconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLMConfigSpec defines the desired state of LLMConfig
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces restricts which namespaces may reference this LLMConfig
                  through llmConfigRef. When unset, Agents and Remediators in any namespace
                  may reference it. When set, only the LLMConfig's own namespace and the
                  listed namespaces may. Wildcards are not supported.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              anthropic:
                description: Anthropic defines configuration for the direct Anthropic
                  API provider
                properties:
                  apiKeySecretRef:
                    description: |-
                      ApiKeySecretRef defines the reference to a secret containing the Anthropic API key.
                      Required unless spec.identity is set, and must be absent when it is.
                    properties:
                      key:
                        description: Key is the key within the secret
                        type: string
                      name:
                        description: Name is the name of the secret
                        type: string
                      namespace:
                        description: Namespace is the namespace of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  baseURL:
                    description: |-
                      BaseURL overrides the Anthropic API endpoint. Set this when the API is
                      fronted by an internal gateway or proxy. Must include the scheme, for
                      example "https://ai-gateway.internal". Defaults to https://api.anthropic.com
                      Required when spec.identity is set; its origin must then be listed in
                      spec.identity.boundOrigins.
                      MaxLength bounds the CEL cost of the spec.identity origin rule.
                    maxLength: 2048
                    type: string
                  model:
                    description: |-
                      Model defines the Anthropic model to use, for example "claude-opus-5".
                      Required: there is no default, so that the configured model is always
                      explicit and does not drift when dependencies are upgraded.
                    type: string
                required:
                - model
                type: object
              azureOpenAI:
                description: AzureOpenAI defines configuration for Azure OpenAI provider
                properties:
                  apiKeySecretRef:
                    description: |-
                      ApiKeySecretRef defines the reference to a secret containing Azure OpenAI API key.
                      Required unless spec.identity is set, and must be absent when it is.
                    properties:
                      key:
                        description: Key is the key within the secret
                        type: string
                      name:
                        description: Name is the name of the secret
                        type: string
                      namespace:
                        description: Namespace is the namespace of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  deploymentName:
                    description: DeploymentName defines the name of the deployment
                    type: string
                  endpoint:
                    description: |-
                      Endpoint defines the Azure OpenAI endpoint URL
                      MaxLength bounds the CEL cost of the spec.identity origin rule.
                    maxLength: 2048
                    type: string
                required:
                - deploymentName
                - endpoint
                type: object
              bedrock:
                description: Bedrock defines configuration for Amazon Bedrock provider
                properties:
                  credentialsSecretRef:
                    description: CredentialsSecretRef defines the reference to a secret
                      containing AWS credentials
                    properties:
                      key:
                        description: Key is the key within the secret
                        type: string
                      name:
                        description: Name is the name of the secret
                        type: string
                      namespace:
                        description: Namespace is the namespace of the secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  externalId:
                    description: ExternalId defines the external ID for role assumption
                    type: string
                  model:
                    description: Model defines the Bedrock model to use (can be model
                      ID or inference profile ARN)
                    type: string
                  region:
                    description: Region defines the AWS region for Bedrock service
                    type: string
                  roleArn:
                    description: RoleArn defines the ARN of the IAM role to assume
                      for accessing Bedrock
                    type: string
                required:
                - model
                - region
                type: object
              identity:
                description: |-
                  Identity configures workload identity for the LLM provider: the agent
                  obtains a short-lived access token from an identity provider instead of
                  reading a static API key. Supported for the anthropic and azure-openai
                  providers; the provider's apiKeySecretRef must then be absent.

                  API preview: this version of Service Agent accepts and validates the
                  field but does not use it yet. An LLMConfig with identity set fails LLM
                  client creation until runtime support lands.
                properties:
                  allowInClusterHTTP:
                    description: |-
                      AllowInClusterHTTP permits plain http for tokenURL and boundOrigins
                      whose host ends in .svc or .svc.cluster.local, for gateways and token
                      endpoints that run as in-cluster Services. Defaults to false.
                    type: boolean
                  boundOrigins:
                    description: |-
                      BoundOrigins lists the origins (scheme://host[:port], no path, query,
                      fragment or userinfo) the token may be sent to. The provider endpoint's
                      origin must be one of them; requests to any other origin never carry
                      the token.
                    items:
                      maxLength: 512
                      pattern: ^https?://[^/?#@\s]+/?$
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  oauth2ClientCredentials:
                    description: |-
                      OAuth2ClientCredentials configures the OAuth 2.0 client credentials
                      grant. Required when type is oauth2ClientCredentials.
                    properties:
                      clientIDSecretRef:
                        description: ClientIDSecretRef selects the Secret key holding
                          the OAuth client ID.
                        properties:
                          key:
                            description: Key is the key within the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      clientSecretSecretRef:
                        description: ClientSecretSecretRef selects the Secret key
                          holding the OAuth client secret.
                        properties:
                          key:
                            description: Key is the key within the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[-._a-zA-Z0-9]+$
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      scopes:
                        description: Scopes requested with the token, for example
                          api://llm-gateway/.default.
                        items:
                          maxLength: 512
                          minLength: 1
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                      tokenURL:
                        description: |-
                          TokenURL is the identity provider's token endpoint, for example
                          https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token.
                        maxLength: 2048
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: tokenURL must be an absolute URL
                          rule: isURL(self)
                    required:
                    - clientIDSecretRef
                    - clientSecretSecretRef
                    - tokenURL
                    type: object
                  type:
                    description: Type selects the identity mechanism.
                    enum:
                    - oauth2ClientCredentials
                    type: string
                required:
                - boundOrigins
                - type
                type: object
                x-kubernetes-validations:
                - message: oauth2ClientCredentials is required when type is oauth2ClientCredentials
                  rule: self.type != 'oauth2ClientCredentials' || has(self.oauth2ClientCredentials)
                - message: oauth2ClientCredentials.tokenURL must use https (http is
                    allowed only with allowInClusterHTTP for a .svc or .svc.cluster.local
                    host)
                  rule: '!has(self.oauth2ClientCredentials) || !isURL(self.oauth2ClientCredentials.tokenURL)
                    || url(self.oauth2ClientCredentials.tokenURL).getScheme() == ''https''
                    || ((has(self.allowInClusterHTTP) && self.allowInClusterHTTP)
                    && url(self.oauth2ClientCredentials.tokenURL).getScheme() == ''http''
                    && (url(self.oauth2ClientCredentials.tokenURL).getHostname().endsWith(''.svc'')
                    || url(self.oauth2ClientCredentials.tokenURL).getHostname().endsWith(''.svc.cluster.local'')))'
                - message: boundOrigins must use https (http is allowed only with
                    allowInClusterHTTP for a .svc or .svc.cluster.local host)
                  rule: self.boundOrigins.all(o, (o.startsWith('https://') && isURL(o))
                    || ((has(self.allowInClusterHTTP) && self.allowInClusterHTTP)
                    && o.startsWith('http://') && isURL(o) && (url(o).getHostname().endsWith('.svc')
                    || url(o).getHostname().endsWith('.svc.cluster.local'))))
              nirmataAI:
                description: Nirmata defines configuration for Nirmata provider
                properties:
                  model:
                    description: Model defines the Nirmata model to use
                    type: string
                required:
                - model
                type: object
              type:
                description: Type defines the type of provider.
                enum:
                - bedrock
                - azure-openai
                - nirmataAI
                - anthropic
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: spec.identity is only supported for the anthropic and azure-openai
                providers (unsupported provider)
              rule: '!has(self.identity) || self.type in [''anthropic'', ''azure-openai'']'
            - message: spec.anthropic.apiKeySecretRef must not be set when spec.identity
                is set
              rule: '!has(self.identity) || !has(self.anthropic) || !has(self.anthropic.apiKeySecretRef)'
            - message: spec.azureOpenAI.apiKeySecretRef must not be set when spec.identity
                is set
              rule: '!has(self.identity) || !has(self.azureOpenAI) || !has(self.azureOpenAI.apiKeySecretRef)'
            - message: spec.anthropic.apiKeySecretRef is required unless spec.identity
                is set
              rule: has(self.identity) || !has(self.anthropic) || has(self.anthropic.apiKeySecretRef)
            - message: spec.azureOpenAI.apiKeySecretRef is required unless spec.identity
                is set
              rule: has(self.identity) || !has(self.azureOpenAI) || has(self.azureOpenAI.apiKeySecretRef)
            - message: spec.anthropic.baseURL is required when spec.identity is set
              rule: '!has(self.identity) || self.type != ''anthropic'' || (has(self.anthropic)
                && has(self.anthropic.baseURL))'
            - message: spec.azureOpenAI is required when spec.identity is set
              rule: '!has(self.identity) || self.type != ''azure-openai'' || has(self.azureOpenAI)'
            - message: the origin (scheme://host[:port]) of spec.anthropic.baseURL
                must be listed in spec.identity.boundOrigins
              rule: '!has(self.identity) || self.type != ''anthropic'' || !has(self.anthropic)
                || !has(self.anthropic.baseURL) || self.identity.boundOrigins.exists(o,
                self.anthropic.baseURL == o || self.anthropic.baseURL + ''/'' == o
                || self.anthropic.baseURL.startsWith(o.endsWith(''/'') ? o : o + ''/''))'
            - message: the origin (scheme://host[:port]) of spec.azureOpenAI.endpoint
                must be listed in spec.identity.boundOrigins
              rule: '!has(self.identity) || self.type != ''azure-openai'' || !has(self.azureOpenAI)
                || self.identity.boundOrigins.exists(o, self.azureOpenAI.endpoint
                == o || self.azureOpenAI.endpoint + ''/'' == o || self.azureOpenAI.endpoint.startsWith(o.endsWith(''/'')
                ? o : o + ''/''))'
          status:
            description: LLMConfigStatus defines the observed state of LLMConfig
            properties:
              conditions:
                description: |-
                  Conditions describe the LLMConfig's current state. The IdentityReady
                  condition reports whether spec.identity can acquire a token.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  was computed from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
