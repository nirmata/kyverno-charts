# CRD Chart Configuration
# Set to false to skip CRD installation (useful if managing CRDs separately)
crds:
  install: true

replicaCount: 1

image:
  repository: reg.nirmata.io/nirmata/go-nirmata-agent
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

jobConfigurations:
  image:
    # -- (string) Image registry
    registry: ghcr.io
    # -- Image repository
    repository: nirmata/kubectl
    # -- Image tag
    # Defaults to `latest` if omitted
    tag: '1.34.0'
    # -- (string) Image pull policy
    # Defaults to image.pullPolicy if omitted
    pullPolicy: IfNotPresent

  # -- Image pull secrets
  imagePullSecrets: []

  # -- Security context for the pod
  podSecurityContext: {}

  # -- Node labels for pod assignment
  nodeSelector: {}

  # -- List of node taints to tolerate
  tolerations: []

  # -- Pod anti affinity constraints.
  podAntiAffinity: {}

  # -- Pod affinity constraints.
  podAffinity: {}

  # -- Pod labels.
  podLabels: {}

  # -- Pod annotations.
  podAnnotations: {}

  # -- Node affinity constraints.
  nodeAffinity: {}

  # -- Security context for the hook containers
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  annotations: {}
  name: ""


resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Logging configuration
logging:
  # Set verbosity level (0=info, 1=audit+info, 2=debug+audit+info)
  verbosity: 0
  # Enable audit logging (if true, overrides verbosity=0 to ensure audit logs are visible)
  enableAudit: false
  # Log output format: "text" (human-readable, the default) or "json" (one JSON object
  # per line, including klog output, for log collectors such as the OpenTelemetry Collector)
  format: text

# OpenTelemetry tracing. Spans cover each Remediator run, collector, plan generation and
# action execution, and are exported over OTLP gRPC. The standard OTEL_* environment
# variables also work (see docs/observability.md).
tracing:
  # Export traces. When false, tracing stays off unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
  enabled: false
  # OTLP gRPC endpoint (sets OTEL_EXPORTER_OTLP_ENDPOINT), e.g.
  # http://otel-collector.observability:4317. Empty uses the exporter default (localhost:4317).
  endpoint: ""
  # Connect without TLS (sets OTEL_EXPORTER_OTLP_INSECURE=true).
  insecure: false
  # service.name resource attribute (sets OTEL_SERVICE_NAME). Empty uses go-nirmata-agent.
  serviceName: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Metrics server configuration
metrics:
  port: 8080
  secure: false
  service:
    enabled: true
    name: service-agent-metrics-service
    type: ClusterIP
    port: 8443

# Inline credentials (optional, single-command install)
# -----------------------------------------------------
# Every credential below can be supplied either as a reference to an existing
# Secret (the *secretRef / *Secret values) or inline (serviceAccountToken,
# apiToken, apiKey, accessKeyId/secretAccessKey, pat.token, app.privateKey).
# When an inline value is set, the chart creates the Secret and points the
# consumer at it; the existing secret-name value, if set, becomes the generated
# Secret's name. Nothing is created when inline values are empty.
#
# SECURITY: inline values are stored in the Helm release (a Secret in the
# release namespace) and in your shell history or values files. Prefer
# pre-created Secrets or an external secret manager (External Secrets Operator,
# Sealed Secrets, Vault) for production, and pass inline values with
# --set / --set-file rather than committing them to a values file. A generated
# Secret is deleted on helm uninstall, and installing one whose name already
# exists (e.g. a manually created nirmata-service-account-token) fails until the
# existing Secret is removed or a different name is chosen.

# LLM provider configuration for creating an LLMConfig CR
llm:
  enabled: true
  provider: "nirmataAI"  # Options: nirmataAI, bedrock, azure-openai, anthropic
  bedrock:
    model: ""
    region: ""
    # Inline AWS credentials (optional). Set both to create
    # nirmata-agent-bedrock-credentials (or secretRef.name, if set).
    # Leave empty for Pod Identity / IRSA or a pre-created Secret.
    accessKeyId: ""
    secretAccessKey: ""
    sessionToken: ""
    secretRef:
      name: ""
      # Optional for some auth methods
      key: "aws_access_key_id"
  azureOpenAI:
    endpoint: ""
    deploymentName: ""
    # Inline API key (optional). Creates nirmata-agent-azure-openai
    # (or secretRef.name, if set) under secretRef.key.
    apiKey: ""
    secretRef:
      name: ""
      # Defaults to standard header key
      key: "api-key"
  nirmataAI:
    model: ""
  # Direct Anthropic API, using a customer-supplied API key. Use baseURL to
  # point at an internal gateway instead of the public Anthropic API.
  anthropic:
    # Required. For example: claude-opus-5, claude-sonnet-5, claude-haiku-4-5
    model: ""
    # Optional. Include the scheme, e.g. https://ai-gateway.internal
    # Leave empty to use https://api.anthropic.com
    baseURL: ""
    # Inline API key (optional). Creates nirmata-agent-anthropic
    # (or secretRef.name, if set) under secretRef.key.
    apiKey: ""
    secretRef:
      name: ""
      key: "api-key"

nirmata:
  # Nirmata endpoint URL - used to set the --url command-line flag
  endpoint: "https://nirmata.io"

  # Authentication method selection
  # Options: "serviceAccountToken", "apiToken", or "none"
  # This determines which authentication method will be used.
  #
  # Set to "none" (or leave empty) when no Nirmata platform functionality is
  # required -- for example when using your own LLM provider (bedrock,
  # azure-openai, anthropic) together with your own GitHub credentials
  # (tool.credentials.method "pat" or "app"). No credential is then injected
  # into the deployment.
  #
  # These features require a credential and are unavailable with "none":
  #   - llm.provider "nirmataAI"
  #   - tool.credentials.method "nirmata-app"
  #   - policy exception requests (the "request-exception" PR command)
  #   - agent tools: email, send_slack_message, list_slack_channels
  auth: "serviceAccountToken"

  # Service Account Token configuration
  # Used when auth is set to "serviceAccountToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-service-account-token --from-literal=service-account-token=YOUR_TOKEN -n <namespace>
  # or set serviceAccountToken below to have the chart create it.
  serviceAccountTokenSecret: "nirmata-service-account-token"

  # Key within the secret containing Nirmata service account token
  # Defaults to "service-account-token"
  serviceAccountTokenSecretKey: "service-account-token"

  # Inline service account token (optional). When set and auth is
  # "serviceAccountToken", the chart creates serviceAccountTokenSecret.
  serviceAccountToken: ""

  # API Token configuration
  # Used when auth is set to "apiToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-api-token --from-literal=api-token=YOUR_API_TOKEN -n <namespace>
  # or set apiToken below to have the chart create it.
  apiTokenSecret: ""

  # Key within the secret containing Nirmata API token
  # Defaults to "api-token"
  apiTokenSecretKey: "api-token"

  # Inline API token (optional). When set and auth is "apiToken", the chart
  # creates apiTokenSecret (default name: nirmata-api-token).
  apiToken: ""

# ToolConfig for the git provider (used by CreatePR / DryRun and for cloning)
tool:
  enabled: true
  # ToolConfig name. Leave empty to default to nirmata-agent-<type>
  # (nirmata-agent-github or nirmata-agent-gitlab).
  name: github-tool
  # Git provider. One of: github | gitlab | azure-devops | bitbucket
  # (azure-devops and bitbucket require credentials.method: pat; bitbucket also
  # requires credentials.pat.usernameSecret)
  type: github

  # Optional API base URL override, only for tool.type gitlab or azure-devops
  # (rejected for github). By default it is derived from each repository URL,
  # which is correct for gitlab.com and for GitLab served at the host root. Set it
  # when GitLab is served under a URL path prefix (e.g.
  # https://gitlab.example.internal/gitlab), when the API host differs from the
  # repository host, or to the Azure DevOps organization/collection URL (e.g.
  # Azure DevOps Server).
  baseURL: ""

  # TLS settings for connections to the git provider (git clone and API calls).
  # Use caBundleSecretRef when the server certificate is signed by a private or
  # corporate CA. The Secret must live in the release namespace and hold a
  # PEM-encoded CA bundle under `key`.
  tls:
    # Disables certificate verification entirely. Not recommended for production.
    insecureSkipVerify: false
    caBundleSecretRef:
      name: ""
      key: "ca.crt"

  # Authentication method configuration
  # Choose between:
  #   - "nirmata-app" (default & recommended): Uses Nirmata-managed GitHub App with existing credentials
  #   - "app": Custom GitHub App authentication with private key (github only)
  #   - "pat": Personal / project access token (github, gitlab, azure-devops), or a
  #            Bitbucket app-password plus usernameSecret (simplest for testing)
  credentials:
    method: nirmata-app  # Options: "nirmata-app" (default), "app", or "pat"

    # Nirmata GitHub App is the default - no additional configuration needed!
    # Uses SERVICE_ACCOUNT_TOKEN or API_TOKEN already configured for LLM access

    # Custom GitHub App configuration (uncomment and use when method: app)
    # app:
    #   appId: ""  # Set this to your GitHub App ID
    #   # installationId: ""  # Optional: set if you want to specify installation ID
    #   privateKeySecret:
    #     name: "github-app-private-key"
    #     key: "private-key.pem"
    #   # Or supply the PEM key inline and let the chart create the Secret
    #   # (nirmata-agent-github-app unless privateKeySecret.name is set):
    #   #   --set-file tool.credentials.app.privateKey=./private-key.pem
    #   privateKey: ""

    # PAT configuration (uncomment and use when method: pat)
    # pat:
    #   secret:
    #     name: "github-token"
    #     key: "token"
    #   # Or supply the token inline and let the chart create the Secret
    #   # (nirmata-agent-git-token unless secret.name is set):
    #   token: ""
    #   # Bitbucket only: username for REST API calls (the account email on
    #   # Atlassian-managed accounts). Required when tool.type is bitbucket.
    #   usernameSecret:
    #     name: "bitbucket-credentials"
    #     key: "username"
    #   # Bitbucket only, optional: account username for git HTTPS clone, when it
    #   # differs from usernameSecret. Defaults to usernameSecret.
    #   gitUsernameSecret:
    #     name: "bitbucket-credentials"
    #     key: "git-username"

  defaults:
    git:
      pullRequests:
        branchPrefix: remediation-
        # PR labels computed per PR: branch, clusterName, appName, namespace, remediatorName.
        # Unset: remediatorName, clusterName, namespace and branch. [] turns them off.
        # systemLabels: []

# Remediator CR
remediator:
  enabled: false
  name: nirmata-agent
  environment:
    # Type of environment. One of: localCluster | argoHub | fluxHub
    # localCluster: remediate the cluster where the controller runs
    # argoHub: remediate clusters managed by ArgoCD (hub-spoke architecture)
    # fluxHub: remediate clusters managed by FluxCD (hub-spoke architecture)
    # VCS sources are NOT an environment type - configure target.vcs below
    # instead; it works alongside any of the three types above.
    type: argoHub
  target:
    argoHub:
      clusterNames: []
      clusterServerUrls: []
      appSelector:
        allApps: true
    # localCluster:
    #   repoNamespaceMappingRef:
    #     name: repo-namespace-mapping
    #     namespace: nirmata
    #     key: mapping
    # Used when environment.type is fluxHub. Set kustomizationSelector and/or
    # helmReleaseSelector; each accepts names, namespaces, labelSelector, or
    # allKustomizations/allHelmReleases.
    # fluxHub:
    #   fluxNamespace: flux-system
    #   kustomizationSelector:
    #     names:
    #       - my-app
    #     # namespaces:
    #     #   - production
    #     # labelSelector:
    #     #   matchLabels:
    #     #     nirmata.io/remediation: "enabled"
    #     # allKustomizations: true
    #   # helmReleaseSelector:
    #   #   allHelmReleases: true
    # vcs:
    #   policies:
    #     - name: pss-restricted
    #       repo: https://github.com/nirmata/kyverno-policies
    #       path: pod-security/restricted
    #       ref: main
    #   resources:
    #     - name: nginx-deployment
    #       repo: https://github.com/nirmata/demo-remediator
    #       path: apps/nginx
    #       ref: main
    #       policyRefs:
    #         - pss-restricted
  remediation:
    # How remediation plans are generated. One of:
    #   ai:           an LLM generates the fix (requires an LLMConfig; see llmConfigRef)
    #   prescriptive: deterministic resource right-sizing from VPA recommendations
    #                 and policy bounds; no LLM and no LLMConfig are needed
    remediationMode: ai

    # LLMConfig used in ai mode. Ignored (and not rendered) in prescriptive mode.
    llmConfigRef:
      # Defaults to nirmata-agent-llm, the LLMConfig this chart creates when llm.enabled=true
      name: ""
      # Defaults to the release namespace
      namespace: ""

    # Prescriptive mode only: policies whose policies.kyverno.io/category
    # annotation is in this list are remediated. Omit to use the CRD default
    # ("Resource Management").
    # resourceOptimization:
    #   policyCategories:
    #     - "Resource Management"

    schedule: "0 */6 * * *"
    eventPolling:
      enabled: true
      # intervalMinutes: 5  # Optional: polling interval in minutes (default: 5)
      # Git usernames allowed to run @nirmatabot PR comment commands (split-pr,
      # request-exception); case-insensitive. Empty allows every commenter and
      # logs a warning on each poll. Recommended for public or widely shared repos.
      # allowedUsers:
      #   - alice
    actions:
      - type: CreatePR
        # toolRefName defaults to the ToolConfig created by this chart
        # (tool.name, or nirmata-agent-<tool.type> when tool.name is empty)
        # toolRefName: github-tool

# Agent Configuration
# Deploy a custom Agent resource for autonomous operations
agent:
  # Enable/disable Agent deployment
  enabled: false

  # Agent name (defaults to <release-name>-agent)
  name: ""

  # Custom instruction that defines the agent's behavior and task
  # This is the primary directive that tells the agent what to accomplish
  # Example: "Scan my cluster every 6 hours for policy violations and send a summary email"
  prompt: ""

  # List of additional tool names available to the agent
  # Optional tools that require NCH credentials:
  #   - email: Send email notifications
  #   - send_slack_message: Send messages to Slack
  #   - list_slack_channels: List available Slack channels
  # Example:
  # tools:
  #   - email
  #   - send_slack_message
  tools: []

  # Environment configuration
  environment:
    # Type of environment. One of: localCluster | argoHub
    # localCluster: Scan the current cluster where the controller is deployed
    # argoHub: Scan clusters managed by ArgoCD (hub-spoke architecture)
    # Note: the Agent CRD also accepts fluxHub, but this chart cannot render an
    # agent.target.fluxHub block yet, so fluxHub would fail CRD validation here.
    # VCS sources are NOT an environment type - configure target.vcs below
    # instead; it works alongside either type above.
    type: localCluster

  # Target configuration (optional for localCluster, required for argoHub)
  target:
    # LocalCluster target configuration
    # Used when environment.type is localCluster
    localCluster:
      # Reference to ConfigMap containing repo-namespace mappings
      # Required for localCluster remediation workflows
      repoNamespaceMappingRef:
        name: ""           # ConfigMap name
        namespace: ""      # ConfigMap namespace (defaults to release namespace)
        key: "mapping"     # Key within ConfigMap (defaults to "mapping")

    # ArgoHub target configuration
    # Used when environment.type is argoHub
    # Define which clusters and applications to scan
    argoHub:
      # List of cluster names to target (optional)
      # Example:
      # clusterNames:
      #   - prod-cluster-1
      #   - staging-cluster
      clusterNames: []

      # List of cluster server URLs to target (optional)
      # Example:
      # clusterServerUrls:
      #   - https://prod-cluster.example.com
      clusterServerUrls: []

      # Application selector
      # Defines which ArgoCD applications to scan
      appSelector:
        # Select all applications (wildcard)
        # When true, other selector options are ignored
        allApps: false

        # OR select by application names
        # names:
        #   - app-1
        #   - app-2

        # OR select by label selector
        # labelSelector:
        #   matchLabels:
        #     environment: production
        #   matchExpressions:
        #     - key: tier
        #       operator: In
        #       values:
        #         - frontend
        #         - backend

    # VCS (Version Control System) target configuration
    # Can be used with any environment type
    # Define policies and resources from git repositories
    vcs:
      # List of policy repositories
      # Example:
      # policies:
      #   - name: pss-restricted
      #     repo: https://github.com/nirmata/kyverno-policies
      #     path: pod-security/restricted
      #     ref: main
      policies: []

      # List of resource repositories with associated policies
      # Example:
      # resources:
      #   - name: nginx-deployment
      #     repo: https://github.com/myorg/k8s-resources
      #     path: apps/nginx
      #     ref: main
      #     policyRefs:
      #       - pss-restricted
      resources: []

  # Triggers define when the agent should execute
  # At least one trigger is required
  triggers:
    # Schedule-based trigger (cron expression)
    - schedule:
        # Cron expression for scheduling
        # Examples:
        #   "0 9 * * *"      - Daily at 9 AM
        #   "0 */6 * * *"    - Every 6 hours
        #   "0 9 * * MON"    - Weekly on Monday at 9 AM
        #   "*/30 * * * *"   - Every 30 minutes
        crontab: "0 */6 * * *"

  # LLM configuration reference
  # Points to the LLMConfig resource to use for AI operations
  llmConfigRef:
    # API version (optional, defaults to serviceagents.nirmata.io/v1alpha1)
    apiVersion: ""

    # Kind (optional, defaults to LLMConfig)
    kind: ""

    # Name of the LLMConfig resource
    # Defaults to <release-name>-llm if not specified
    name: ""

    # Namespace of the LLMConfig resource
    # Defaults to release namespace if not specified
    namespace: ""
