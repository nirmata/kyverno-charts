{{- include "go-nirmata-agent.validateNirmataAuth" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-nirmata-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-nirmata-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "go-nirmata-agent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "go-nirmata-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          args:
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- if or .Values.logging.enableAudit (gt (.Values.logging.verbosity | int) 0) }}
            - -v={{ max (.Values.logging.verbosity | int) (ternary 1 0 .Values.logging.enableAudit) }}
            {{- end }}
            {{- if .Values.nirmata.endpoint }}
            - --url={{ .Values.nirmata.endpoint }}
            {{- end }}
            {{- if and .Values.logging.format (ne .Values.logging.format "text") }}
            - --log-format={{ .Values.logging.format }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - --tracing-enabled
            {{- end }}
          {{- $tracingEnv := and .Values.tracing.enabled (or .Values.tracing.endpoint .Values.tracing.insecure .Values.tracing.serviceName) }}
          {{- if or (include "go-nirmata-agent.nirmataAuthEnabled" .) $tracingEnv }}
          env:
            {{- if $tracingEnv }}
            {{- with .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.tracing.insecure }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            {{- end }}
            {{- /* Only when set: the agent defaults service.name itself, and an always-set
                   OTEL_SERVICE_NAME would override OTEL_RESOURCE_ATTRIBUTES. */}}
            {{- with .Values.tracing.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.nirmata.auth "serviceAccountToken" }}
            - name: SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-nirmata-agent.serviceAccountTokenSecretName" . }}
                  key: {{ .Values.nirmata.serviceAccountTokenSecretKey }}
            {{- else if eq .Values.nirmata.auth "apiToken" }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-nirmata-agent.apiTokenSecretName" . }}
                  key: {{ .Values.nirmata.apiTokenSecretKey }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }} 