{{- /*
Opt-in Secrets generated from inline credential values, so the chart can be
installed with a single helm command. Nothing renders unless an inline value is
set, and each Secret renders only when the component that consumes it is
selected (auth method, credentials method, LLM provider). The consumer's
secretRef defaults to the generated name via the *SecretName helpers in
_helpers.tpl; an explicitly set secret name is used as the generated Secret's
name instead. Values supplied here are stored in the Helm release Secret, so
pre-created Secrets or an external secret manager remain the preferred option.
*/ -}}
{{- $nirmataAuth := .Values.nirmata.auth | default "" }}
{{- if and (eq $nirmataAuth "serviceAccountToken") .Values.nirmata.serviceAccountToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.serviceAccountTokenSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nirmata.serviceAccountTokenSecretKey | quote }}: {{ .Values.nirmata.serviceAccountToken | b64enc | quote }}
{{- end }}
{{- if and (eq $nirmataAuth "apiToken") .Values.nirmata.apiToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.apiTokenSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nirmata.apiTokenSecretKey | quote }}: {{ .Values.nirmata.apiToken | b64enc | quote }}
{{- end }}
{{- if .Values.tool.enabled }}
{{- $creds := .Values.tool.credentials }}
{{- $pat := $creds.pat | default dict }}
{{- $app := $creds.app | default dict }}
{{- if and (eq $creds.method "pat") $pat.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.patSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "go-nirmata-agent.patSecretKey" . | quote }}: {{ $pat.token | b64enc | quote }}
{{- else if and (eq $creds.method "app") $app.privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.appPrivateKeySecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "go-nirmata-agent.appPrivateKeySecretKey" . | quote }}: {{ $app.privateKey | b64enc | quote }}
{{- end }}
{{- end }}
{{- if .Values.llm.enabled }}
{{- $bedrock := .Values.llm.bedrock | default dict }}
{{- $azure := .Values.llm.azureOpenAI | default dict }}
{{- $anthropic := .Values.llm.anthropic | default dict }}
{{- if and (eq .Values.llm.provider "bedrock") (or $bedrock.accessKeyId $bedrock.secretAccessKey) }}
{{- if not (and $bedrock.accessKeyId $bedrock.secretAccessKey) }}
{{- fail "llm.bedrock.accessKeyId and llm.bedrock.secretAccessKey must be set together" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.bedrockSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Fixed keys: pkg/llm/credentials.go reads these regardless of secretRef.key. */}}
  aws_access_key_id: {{ $bedrock.accessKeyId | b64enc | quote }}
  aws_secret_access_key: {{ $bedrock.secretAccessKey | b64enc | quote }}
  {{- if $bedrock.sessionToken }}
  aws_session_token: {{ $bedrock.sessionToken | b64enc | quote }}
  {{- end }}
{{- else if and (eq .Values.llm.provider "azure-openai") $azure.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.azureOpenAISecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ ($azure.secretRef | default dict).key | default "api-key" | quote }}: {{ $azure.apiKey | b64enc | quote }}
{{- else if and (eq .Values.llm.provider "anthropic") $anthropic.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-nirmata-agent.anthropicSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ ($anthropic.secretRef | default dict).key | default "api-key" | quote }}: {{ $anthropic.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
