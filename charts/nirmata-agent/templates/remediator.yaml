{{- if .Values.remediator.enabled }}
{{- if eq .Values.remediator.environment.type "fluxHub" }}
  {{- $flux := (.Values.remediator.target | default dict).fluxHub | default dict }}
  {{- if not (or $flux.kustomizationSelector $flux.helmReleaseSelector) }}
{{- fail "remediator.target.fluxHub is required when environment type is fluxHub - must specify kustomizationSelector and/or helmReleaseSelector" }}
  {{- end }}
{{- end }}
apiVersion: serviceagents.nirmata.io/v1alpha1
kind: Remediator
metadata:
  name: {{ .Values.remediator.name | default (include "go-nirmata-agent.name" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-nirmata-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  environment:
    type: {{ .Values.remediator.environment.type }}
  {{- /* localCluster may have no target block at all; don't emit an empty (null) target. */}}
  {{- $target := .Values.remediator.target | default dict }}
  {{- $isLocal := eq .Values.remediator.environment.type "localCluster" }}
  {{- if and $target (or (not $isLocal) $target.localCluster $target.vcs) }}
  target:
    {{- if and (eq .Values.remediator.environment.type "localCluster") .Values.remediator.target.localCluster }}
    localCluster:
      repoNamespaceMappingRef:
        name: {{ .Values.remediator.target.localCluster.repoNamespaceMappingRef.name | default "repo-namespace-mapping" }}
        namespace: {{ .Values.remediator.target.localCluster.repoNamespaceMappingRef.namespace | default .Release.Namespace }}
        {{- if .Values.remediator.target.localCluster.repoNamespaceMappingRef.key }}
        key: {{ .Values.remediator.target.localCluster.repoNamespaceMappingRef.key }}
        {{- end }}
    {{- else if eq .Values.remediator.environment.type "argoHub" }}
    argoHub:
      {{- if .Values.remediator.target.argoHub }}
      {{- if .Values.remediator.target.argoHub.clusterNames }}
      clusterNames:
        {{- toYaml .Values.remediator.target.argoHub.clusterNames | nindent 8 }}
      {{- end }}
      {{- if .Values.remediator.target.argoHub.clusterServerUrls }}
      clusterServerUrls:
        {{- toYaml .Values.remediator.target.argoHub.clusterServerUrls | nindent 8 }}
      {{- end }}
      {{- with .Values.remediator.target.argoHub.appSelector }}
      appSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- else if eq .Values.remediator.environment.type "fluxHub" }}
    fluxHub:
      {{- with .Values.remediator.target.fluxHub }}
      {{- with .fluxNamespace }}
      fluxNamespace: {{ . }}
      {{- end }}
      {{- with .kustomizationSelector }}
      kustomizationSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .helmReleaseSelector }}
      helmReleaseSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.remediator.target.vcs }}
    vcs:
      {{- if .Values.remediator.target.vcs.policies }}
      policies:
        {{- range .Values.remediator.target.vcs.policies }}
        - name: {{ .name }}
          repo: {{ .repo }}
          path: {{ .path }}
          ref: {{ .ref }}
        {{- end }}
      {{- end }}
      {{- if .Values.remediator.target.vcs.resources }}
      resources:
        {{- range .Values.remediator.target.vcs.resources }}
        - name: {{ .name }}
          repo: {{ .repo }}
          path: {{ .path }}
          ref: {{ .ref }}
          policyRefs:
            {{- toYaml .policyRefs | nindent 12 }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $mode := include "go-nirmata-agent.remediationMode" . }}
  {{- if not (or (eq $mode "ai") (eq $mode "prescriptive")) }}
  {{- fail (printf "remediator.remediation.remediationMode must be 'ai' or 'prescriptive', got: '%s'" $mode) }}
  {{- end }}
  remediation:
    remediationMode: {{ $mode | quote }}
    triggers:
      - schedule:
          crontab: {{ .Values.remediator.remediation.schedule | quote }}
    {{- if .Values.remediator.remediation.matchSeverity }}
    filters:
      policySelector:
        matchSeverity:
          {{- toYaml .Values.remediator.remediation.matchSeverity | nindent 10 }}
    {{- end }}
    {{- if eq $mode "ai" }}
    {{- /* The CRD requires llmConfigRef only in ai mode; prescriptive runs without an LLM. */}}
    {{- $llmRef := .Values.remediator.remediation.llmConfigRef | default dict }}
    llmConfigRef:
      name: {{ $llmRef.name | default (printf "%s-llm" (include "go-nirmata-agent.name" .)) | quote }}
      namespace: {{ $llmRef.namespace | default .Release.Namespace | quote }}
    {{- else }}
    {{- with .Values.remediator.remediation.resourceOptimization }}
    {{- with .policyCategories }}
    resourceOptimization:
      policyCategories:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- end }}
    gitCredentials:
      name: {{ include "go-nirmata-agent.toolName" . | quote }}
      namespace: {{ .Release.Namespace }}
    {{- /* hasKey, not `default true`: default treats an explicit false as unset. */}}
    {{- $eventPolling := .Values.remediator.remediation.eventPolling | default dict }}
    eventPolling:
      enabled: {{ if hasKey $eventPolling "enabled" }}{{ $eventPolling.enabled }}{{ else }}true{{ end }}
      {{- if and .Values.remediator.remediation.eventPolling .Values.remediator.remediation.eventPolling.intervalMinutes }}
      intervalMinutes: {{ .Values.remediator.remediation.eventPolling.intervalMinutes }}
      {{- end }}
    actions:
      {{- range .Values.remediator.remediation.actions }}
      - type: {{ .type }}
        {{- if or (eq .type "CreatePR") (eq .type "DryRun") }}
        toolRef:
          name: {{ .toolRefName | default (include "go-nirmata-agent.toolName" $) | quote }}
          namespace: {{ $.Release.Namespace }}
        {{- end }}
      {{- end }}
{{- end }}
