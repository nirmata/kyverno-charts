# Single-command install: inline Nirmata API token, GitHub App private key
# (normally passed with --set-file) and AWS Bedrock credentials.
nirmata:
  auth: apiToken
  apiToken: fake-nirmata-api-token
llm:
  provider: bedrock
  bedrock:
    model: anthropic.claude-sonnet
    region: us-west-2
    accessKeyId: FAKEACCESSKEYID
    secretAccessKey: fake-secret-access-key
    sessionToken: fake-session-token
tool:
  credentials:
    method: app
    app:
      appId: 123456
      privateKey: |
        -----BEGIN RSA PRIVATE KEY-----
        ZmFrZS1wcml2YXRlLWtleQ==
        -----END RSA PRIVATE KEY-----
