# Single-command install: inline service account token, GitHub PAT and
# Anthropic API key; the chart creates the Secrets with default names.
nirmata:
  serviceAccountToken: fake-service-account-token
llm:
  provider: anthropic
  anthropic:
    model: claude-sonnet-5
    apiKey: fake-anthropic-api-key
tool:
  credentials:
    method: pat
    pat:
      token: fake-github-pat
