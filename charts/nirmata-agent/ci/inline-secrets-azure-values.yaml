# Inline Azure OpenAI key and GitLab token with explicit secret names and keys:
# the generated Secrets take those names, and the CRs reference them.
nirmata:
  auth: none
llm:
  provider: azure-openai
  azureOpenAI:
    endpoint: https://example.openai.azure.com
    deploymentName: gpt-4o
    apiKey: fake-azure-api-key
    secretRef:
      name: my-azure-openai
      key: azure-key
tool:
  type: gitlab
  name: gitlab-tool
  credentials:
    method: pat
    pat:
      token: fake-gitlab-token
      secret:
        name: my-gitlab-token
        key: gitlab-token
