---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: policysets.security.nirmata.io
spec:
  group: security.nirmata.io
  names:
    kind: PolicySet
    listKind: PolicySetList
    plural: policysets
    singular: policyset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.allPoliciesReady
      name: All Policies Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PolicySet is the Schema for the PolicySets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicySetSpec defines the desired state of PolicySet
            properties:
              autoDeployChanges:
                type: boolean
              helm:
                additionalProperties:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Finer customizations for each component are provided in a
                  generic object structure, typically matching the
                  value.yaml of individual components
                type: object
              scope:
                description: |-
                  Scope controls which policies of the set the operator is allowed to apply.
                  An empty value is equivalent to "Cluster". With "Namespace" only namespaced policy
                  kinds (Policy, NamespacedValidatingPolicy, NamespacedMutatingPolicy and
                  NamespacedImageValidatingPolicy) located in one of TargetNamespaces are applied;
                  generate rules and rules that mutate existing resources are rejected, and every
                  rejected document is reported in status.lastSyncErrorMessage.
                enum:
                - Cluster
                - Namespace
                type: string
              source:
                properties:
                  description:
                    type: string
                  git:
                    properties:
                      branch:
                        type: string
                      directoryPath:
                        type: string
                      helmCustomizations:
                        additionalProperties:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        type: object
                      passwordSecret:
                        type: string
                      repoType:
                        type: string
                      repoUrl:
                        type: string
                      username:
                        type: string
                    type: object
                  helm:
                    properties:
                      chartName:
                        type: string
                      chartRepo:
                        type: string
                      helmCustomizations:
                        additionalProperties:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        type: object
                      passwordSecret:
                        type: string
                      username:
                        type: string
                      version:
                        type: string
                    type: object
                  type:
                    type: string
                type: object
              syncInterval:
                type: integer
              targetNamespaces:
                description: |-
                  TargetNamespaces lists the namespaces this PolicySet may deploy policies into on this
                  cluster. It is only used when Scope is "Namespace": documents in other namespaces are
                  ignored (they are meant for another cluster) and, when the list is empty, nothing is
                  applied.
                items:
                  type: string
                type: array
            type: object
          status:
            description: PolicySetStatus defines the observed state of PolicySet
            properties:
              allPoliciesReady:
                type: boolean
              git:
                properties:
                  lastCommitId:
                    type: string
                  lastCommitMessage:
                    type: string
                  lastCommitTime:
                    type: string
                  lastCommiter:
                    type: string
                type: object
              lastSyncErrorMessage:
                type: string
              lastSyncSuccess:
                type: boolean
              lastSyncTime:
                format: date-time
                type: string
              lastUpdated:
                format: date-time
                type: string
              phase:
                type: string
              policies:
                properties:
                  lastStatusUpdated:
                    format: date-time
                    type: string
                  policiesStatus:
                    items:
                      description: |-
                        PolicyState is the status of one policy deployed (or rejected as invalid) by a PolicySet. It is an
                        entry of status.policies.policiesStatus.
                      properties:
                        errorMessage:
                          type: string
                        kind:
                          type: string
                        lastApplied:
                          type: string
                        lastAppliedCommit:
                          type: string
                        name:
                          description: |-
                            Name identifies the policy. Its format depends on Kind and must stay stable, because the
                            Nirmata Control Hub, nctl and older operator-aware clients match on it: a Policy is reported as
                            "<namespace>/<name>", every other kind (ClusterPolicy, ValidatingPolicy and the Namespaced*
                            kinds) as the bare "<name>". For an invalid policy file the name may be the file name.
                          type: string
                        namespace:
                          description: |-
                            Namespace is the namespace of the policy. It is set for Policy and the Namespaced* kinds
                            (NamespacedValidatingPolicy, NamespacedMutatingPolicy, NamespacedImageValidatingPolicy),
                            including a Namespaced* policy without metadata.namespace, which is deployed to the operator
                            namespace and reported with that namespace. It is empty for the cluster-scoped kinds.
                            Together with Kind and Name it tells apart same-named Namespaced* policies of different
                            namespaces, which share the bare Name.
                          type: string
                        ready:
                          type: boolean
                      required:
                      - ready
                      type: object
                    type: array
                  readyPolicies:
                    type: integer
                  totalPolicies:
                    type: integer
                required:
                - readyPolicies
                - totalPolicies
                type: object
              policiesNotReady:
                items:
                  type: string
                type: array
            required:
            - allPoliciesReady
            - lastSyncSuccess
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
