# CRD Chart Configuration
# Set to false to skip CRD installation (useful if managing CRDs separately)
crds:
  install: true

replicaCount: 1

image:
  repository: reg.nirmata.io/nirmata/go-agent-remediator
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

jobConfigurations:
  image:
    # -- (string) Image registry
    registry: ghcr.io
    # -- Image repository
    repository: nirmata/kubectl
    # -- Image tag
    # Defaults to `latest` if omitted
    tag: '1.34.0'
    # -- (string) Image pull policy
    # Defaults to image.pullPolicy if omitted
    pullPolicy: IfNotPresent

  # -- Image pull secrets
  imagePullSecrets: []

  # -- Security context for the pod
  podSecurityContext: {}

  # -- Node labels for pod assignment
  nodeSelector: {}

  # -- List of node taints to tolerate
  tolerations: []

  # -- Pod anti affinity constraints.
  podAntiAffinity: {}

  # -- Pod affinity constraints.
  podAffinity: {}

  # -- Pod labels.
  podLabels: {}

  # -- Pod annotations.
  podAnnotations: {}

  # -- Node affinity constraints.
  nodeAffinity: {}

  # -- Security context for the hook containers
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  annotations: {}
  name: ""


resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Logging configuration
logging:
  # Set verbosity level (0=info, 1=audit+info, 2=debug+audit+info)
  verbosity: 0
  # Enable audit logging (if true, overrides verbosity=0 to ensure audit logs are visible)
  enableAudit: false

nodeSelector: {}
tolerations: []
affinity: {}

# LLM provider configuration for creating an LLMConfig CR
llm:
  enabled: true
  provider: "nirmataAI"  # Options: bedrock, azure-openai
  bedrock:
    model: ""
    region: ""
    secretRef:
      name: ""
      # Optional for some auth methods
      key: "aws_access_key_id"
  azureOpenAI:
    endpoint: ""
    deploymentName: ""
    secretRef:
      name: ""
      # Defaults to standard header key
      key: "api-key"
  nirmataAI:
    model: ""

nirmata:
  # Nirmata endpoint URL - used to set the --url command-line flag
  endpoint: "https://nirmata.io"

  # Authentication method selection
  # Options: "serviceAccountToken" or "apiToken"
  # This determines which authentication method will be used
  auth: "serviceAccountToken"

  # Service Account Token configuration
  # Used when auth is set to "serviceAccountToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-service-account-token --from-literal=service-account-token=YOUR_TOKEN -n <namespace>
  serviceAccountTokenSecret: "nirmata-service-account-token"

  # Key within the secret containing Nirmata service account token
  # Defaults to "service-account-token"
  serviceAccountTokenSecretKey: "service-account-token"

  # API Token configuration
  # Used when auth is set to "apiToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-api-token --from-literal=api-token=YOUR_API_TOKEN -n <namespace>
  apiTokenSecret: ""

  # Key within the secret containing Nirmata API token
  # Defaults to "api-token"
  apiTokenSecretKey: "api-token"

# ToolConfig for the git provider (used by CreatePR)
tool:
  enabled: true

  # ToolConfig name. Leave empty to derive it from the provider
  # ("remediator-agent-<tool.type>", e.g. remediator-agent-azure-devops).
  # Set it explicitly to pin a name (e.g. "github-tool" for installs made
  # before provider-aware naming existed).
  name: ""

  # Git provider hosting the repositories the agent opens PRs against.
  # Options: github, gitlab, azure-devops
  #
  # Note: this is unrelated to `llm.provider: azure-openai`, which only selects an
  # LLM backend. This setting controls where the agent pushes code.
  type: github

  # Optional. Overrides the API endpoint for self-hosted git servers
  # (GitHub Enterprise, self-managed GitLab, Azure DevOps Server).
  #
  # For Azure Repos this is the organization- or collection-level URL. It is
  # normally unnecessary: the organization and project are derived from each
  # repository URL, so set this only when the API endpoint differs from the
  # repository URL host.
  #   baseURL: "https://tfs.corp.example.com/DefaultCollection"
  baseURL: ""

  # Authentication method configuration
  # Choose between "pat" (Personal Access Token) or "app" (GitHub App)
  #
  # azure-devops supports "pat" only. The PAT needs the "Code (read & write)"
  # scope, and "Pull Request Threads (read & write)" if the agent should also
  # post PR comments.
  credentials:
    method: pat  # Options: "pat" or "app" (recommended: "app" for better security)

    # app:
    #   appId: ""  # Set this to your GitHub App ID
    #   # installationId: ""  # Optional: set if you want to specify installation ID
    #   privateKeySecret:
    #     name: "github-app-private-key"
    #     key: "private-key.pem"

    # PAT configuration (used when method: pat)
    pat:
      secret:
        name: "github-token"
        key: "token"

  # Optional TLS settings for reaching the git server. Use this when the server
  # presents a certificate signed by a corporate/private CA that is not in the
  # container's trust store (e.g. Azure DevOps Server behind a TLS-intercepting
  # proxy). Rendered into the ToolConfig's spec.tls.
  #
  # tls:
  #   caBundleSecretRef:
  #     name: corp-ca-bundle   # kubectl create secret generic corp-ca-bundle \
  #     key: ca.crt            #   --from-file=ca.crt=./corp-ca.pem -n <namespace>
  #     # namespace: ""        # Optional; defaults to the release namespace
  #   # insecureSkipVerify: false  # NOT recommended; prefer caBundleSecretRef
  tls: {}

  defaults:
    git:
      pullRequests:
        branchPrefix: remediation-

# ---------------------------------------------------------------------------
# Azure Repos (Azure DevOps) example
#
# tool:
#   enabled: true
#   type: azure-devops
#   credentials:
#     method: pat
#     pat:
#       secret:
#         name: azure-devops-pat   # kubectl create secret generic azure-devops-pat \
#         key: token               #   --from-literal=token=<PAT> -n <namespace>
#   defaults:
#     git:
#       pullRequests:
#         branchPrefix: remediation-
#
# The ToolConfig is then named "remediator-agent-azure-devops", and the default
# CreatePR action references it automatically — no toolRefName needed.
#
# Repository URLs may use any Azure Repos form, e.g.
#   https://dev.azure.com/{org}/{project}/_git/{repo}
#   https://{org}.visualstudio.com/{project}/_git/{repo}
# ---------------------------------------------------------------------------

# Remediator CR
remediator:
  enabled: false
  name: remediator-agent
  environment:
    type: argoHub  # Options: localCluster, argoHub (vcsTarget can be used with any environment type)
  target:
    argoHub:
      clusterNames: []
      clusterServerUrls: []
      appSelector:
        allApps: true
    # localCluster:
    #   repoNamespaceMappingRef:
    #     name: repo-namespace-mapping
    #     namespace: nirmata
    #     key: mapping
    # vcs:
    #   policies:
    #     - name: pss-restricted
    #       repo: https://github.com/nirmata/kyverno-policies
    #       path: pod-security/restricted
    #       ref: main
    #   resources:
    #     - name: nginx-deployment
    #       repo: https://github.com/nirmata/demo-remediator
    #       path: apps/nginx
    #       ref: main
    #       policyRefs:
    #         - pss-restricted
  remediation:
    schedule: "0 */6 * * *"
    eventPolling:
      enabled: true
      # intervalMinutes: 5  # Optional: polling interval in minutes (default: 5)
    actions:
      # toolRefName is optional: when unset the action points at the
      # ToolConfig this chart creates (see tool.name above), so the ref can
      # never drift from the provider.
      - type: CreatePR
